spring:
  application:
    name: camposync

  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:agro_data}
    username: ${DB_USER:admin_saas}
    password: ${DB_PASSWORD:AsiSomos2026_12}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    secret: ${JWT_SECRET:unaClaveSecretaMuyLargaParaFirmarTokensJWT2024CampoSync}
    expiration: 86400000  # 24 horas en milisegundos

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:CampoSync2024Redis!}
